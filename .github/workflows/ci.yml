# Continuous integration: lint, type-check, unit tests and a no-pack build on every PR.
# Owner: Utku Durmaz - D6-6
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:nopack
      # TODO [D6-6 | Utku Durmaz]: Add an E2E job (xvfb-run npm run test:e2e) once tests are un-skipped.
